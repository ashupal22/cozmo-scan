[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cozmo-scan"
version = "0.1.0"
description = "iPhone photos, video or LiDAR scans of a home to a measured floor plan with damage and repair scope"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cozmo = "cozmo.cli:main"

[tool.setuptools.packages.find]
include = ["cozmo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
